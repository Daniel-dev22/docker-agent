name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: go vet
        run: go vet ./...

      # The `-tags smoke` suites are deliberately NOT run here: they drive a live
      # Docker daemon. So is resolvers_live_test.go, which is skipped unless
      # DOCKER_AGENT_GH_TOKEN is set. `go test ./...` is hermetic.
      - name: go test
        run: go test ./...
